# meraki_tools.yaml - Meraki MCP server tools definition
# Declarative configuration in logical sequence

base_url: "https://api.meraki.com/api/v1"

tools:
  # STEP 0: Discovery - Find configured organizations
  - name: get_configured_organizations
    description: "🔍 DISCOVERY TOOL: Lists YOUR configured organizations from meraki_organizations.yaml (Prod, Lab, etc). Use this FIRST to discover which organizations are available before calling other tools. Does NOT call Meraki API."
    endpoint: "not_used"
    method: GET
    parameters: {}

  # STEP 1: Get Meraki API organization details
  - name: list_organizations_details
    description: "📡 MERAKI API TOOL: Calls Meraki API to get organization details (IDs, names, URLs). REQUIRES organization parameter ('Prod', 'Lab', or 'all'). Use get_configured_organizations first to see available options."
    endpoint: "organizations"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod', 'Lab', or 'all'). Get available names from get_configured_organizations tool first."
        required: true
        location: special

  # STEP 2: Get networks for organization
  - name: list_networks
    description: "📋 List all networks in a Meraki organization. REQUIRES organization parameter ('Prod', 'Lab', or 'all')."
    endpoint: "organizations/{organization_id}/networks"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod', 'Lab', or 'all'). Networks are organization-specific."
        required: true
        location: special
      organization_id:
        type: string
        description: "Auto-resolved from organization parameter - do not specify manually"
        required: false
        location: path

  # STEP 3: Get network details
  - name: get_network
    description: "🔍 Get detailed information about a specific network. REQUIRES organization parameter matching where the network_id came from."
    endpoint: "networks/{network_id}"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab') where this network exists. Use the same org you used to discover the network_id."
        required: true
        location: special
      network_id:
        type: string
        description: "Network ID from list_networks (e.g., 'L_123456789')"
        required: true
        location: path

  # STEP 4: Get devices in a network
  - name: list_devices
    description: "🖥️ List all devices in a network. REQUIRES organization parameter matching where the network_id came from."
    endpoint: "networks/{network_id}/devices"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab') where this network exists. Must match the org used to get network_id."
        required: true
        location: special
      network_id:
        type: string
        description: "Network ID from list_networks"
        required: true
        location: path

  # STEP 5: Client tools
  - name: get_network_clients
    description: "👥 List all clients connected to a network. REQUIRES organization parameter."
    endpoint: "networks/{network_id}/clients"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab')"
        required: true
        location: special
      network_id:
        type: string
        description: "Network ID from list_networks"
        required: true
        location: path
      timespan:
        type: integer
        description: "Time range in seconds (default: 86400 = 1 day, max: 2678400 = 31 days)"
        required: false
        location: query
      perPage:
        type: integer
        description: "Entries per page returned (range: 3-5000, default: 10 - recommend 1000 for complete results)"
        required: false
        default: 1000
        location: query
        minimum: 3
        maximum: 5000
      startingAfter:
        type: string
        description: "Pagination token for next page (use from previous response Link header)"
        required: false
        location: query
      endingBefore:
        type: string
        description: "Pagination token for previous page (use from previous response Link header)"
        required: false
        location: query
      statuses:
        type: array
        description: "Filter by connection status: ['Online'], ['Offline'], or ['Online','Offline']"
        required: false
        location: query
        items:
          type: string
          enum: [ "Online", "Offline" ]
      recentDeviceConnections:
        type: array
        description: "Filter by connection type: ['Wired'], ['Wireless'], or ['Wired','Wireless']"
        required: false
        location: query
        items:
          type: string
          enum: [ "Wired", "Wireless" ]
      ip:
        type: string
        description: "Filter by IP address (partial or full match)"
        required: false
        location: query
      mac:
        type: string
        description: "Filter by MAC address (partial or full match)"
        required: false
        location: query
      description:
        type: string
        description: "Filter by device description (partial or full match)"
        required: false
        location: query
      vlan:
        type: string
        description: "Filter by VLAN number (full match)"
        required: false
        location: query
      os:
        type: string
        description: "Filter by operating system (partial or full match)"
        required: false
        location: query

  - name: get_device_clients
    description: "👥 List clients connected to a specific device. REQUIRES organization parameter."
    endpoint: "devices/{serial}/clients"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab')"
        required: true
        location: special
      serial:
        type: string
        description: "Device serial number from list_devices"
        required: true
        location: path
      timespan:
        type: integer
        description: "Time range in seconds (default: 3600 = 1 hour)"
        required: false
        location: query

  - name: get_client_details
    description: "🔍 Get detailed information about a specific client. REQUIRES organization parameter."
    endpoint: "networks/{network_id}/clients/{client_id}"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab')"
        required: true
        location: special
      client_id:
        type: string
        description: "Client MAC address (from get_network_clients or get_device_clients)"
        required: true
        location: path
      network_id:
        type: string
        description: "Network ID"
        required: true
        location: path

  - name: search_client_by_mac
    description: "🔎 Search for client by MAC address across all networks in an organization. REQUIRES organization parameter."
    endpoint: "organizations/{organization_id}/clients/search"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab') to search within"
        required: true
        location: special
      mac:
        type: string
        description: "Client MAC address (any format: aa:bb:cc:dd:ee:ff or aabbccddeeff)"
        required: true
        location: query
      organization_id:
        type: string
        description: "Auto-resolved from organization parameter"
        required: false
        location: path

  # STEP 6: Configuration Change Log
  - name: get_organization_configuration_changes
    description: "📝 View the Change Log for your organization. Returns a paginated list of configuration changes. REQUIRES organization parameter ('Prod' or 'Lab'). Uses cursor-based pagination via Link headers."
    endpoint: "organizations/{organization_id}/configurationChanges"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab')"
        required: true
        location: special
      organization_id:
        type: string
        description: "Auto-resolved from organization parameter - do not specify manually"
        required: false
        location: path
      t0:
        type: string
        description: "Start of timespan in ISO 8601 format (max lookback: 365 days). Mutually exclusive with timespan."
        required: false
        location: query
        format: date-time
      t1:
        type: string
        description: "End of timespan in ISO 8601 format (at most 365 days after t0). Mutually exclusive with timespan."
        required: false
        location: query
        format: date-time
      timespan:
        type: float
        description: "Alternative to t0/t1 in seconds (default: 31536000, max: 31536000). Do not use with t0/t1."
        required: false
        default: 31536000
        location: query
        maximum: 31536000
      perPage:
        type: integer
        description: "Entries per page returned (range: 3-5000, default: 5000)."
        required: false
        default: 5000
        location: query
        minimum: 3
        maximum: 5000
      startingAfter:
        type: string
        description: "Pagination token for next page (use value from Link header; do not construct manually)."
        required: false
        location: query
      endingBefore:
        type: string
        description: "Pagination token for previous page (use value from Link header; do not construct manually)."
        required: false
        location: query
      networkId:
        type: string
        description: "Filter changes to a specific network ID."
        required: false
        location: query
      adminId:
        type: string
        description: "Filter changes made by a specific admin ID."
        required: false
        location: query

# STEP 7: Health Alerts and Monitoring
  - name: get_organization_health_alerts
    description: "🚨 Get comprehensive health alerts and issues for a Meraki organization. REQUIRES organization parameter ('Prod' or 'Lab'). Supports filtering by severity, category, device types, and time ranges."
    endpoint: "organizations/{organization_id}/assurance/alerts"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab') to retrieve alerts from"
        required: true
        location: special
      organization_id:
        type: string
        description: "Auto-resolved from organization parameter - do not specify manually"
        required: false
        location: path
      perPage:
        type: integer
        description: "Number of alerts per page returned (range: 4-300, default: 30)"
        required: false
        default: 30
        location: query
        minimum: 4
        maximum: 300
      startingAfter:
        type: string
        description: "Pagination token for next page (use from previous response Link header)"
        required: false
        location: query
      endingBefore:
        type: string
        description: "Pagination token for previous page (use from previous response Link header)"
        required: false
        location: query
      sortOrder:
        type: string
        description: "Sort order for alerts (default: descending by start time)"
        required: false
        default: "descending"
        location: query
        enum: ["ascending", "descending"]
      networkId:
        type: string
        description: "Filter alerts for specific network (e.g., 'L_655273745782415696')"
        required: false
        location: query
      severity:
        type: string
        description: "Filter by alert severity level"
        required: false
        location: query
        enum: ["critical", "warning", "informational"]
      types:
        type: array
        description: "Filter by specific alert types (e.g., ['unreachable', 'config_error', 'pcc_apns_expired'])"
        required: false
        location: query
        items:
          type: string
      tsStart:
        type: string
        description: "Start time for alert filtering (ISO 8601 format: '2025-01-01T00:00:00Z')"
        required: false
        location: query
        format: date-time
      tsEnd:
        type: string
        description: "End time for alert filtering (ISO 8601 format: '2025-12-31T23:59:59Z')"
        required: false
        location: query
        format: date-time
      category:
        type: string
        description: "Filter by alert category"
        required: false
        location: query
        enum: ["configuration", "connectivity", "device_health", "insights"]
      sortBy:
        type: string
        description: "Column to sort alerts by (default: startedAt)"
        required: false
        default: "startedAt"
        location: query
        enum: ["category", "dismissedAt", "resolvedAt", "severity", "startedAt"]
      serials:
        type: array
        description: "Filter by device serial numbers (e.g., ['Q2KN-K62Q-7TSA', 'Q4CB-BTSX-KTR5'])"
        required: false
        location: query
        items:
          type: string
      deviceTypes:
        type: array
        description: "Filter by device types"
        required: false
        location: query
        items:
          type: string
          enum: ["Campus Gateway", "Catalyst AP", "Catalyst Controller", "Catalyst Switch", "MCG", "MG", "MR", "MS", "MT", "MV", "MX", "VMX", "WLC", "Z"]
      deviceTags:
        type: array
        description: "Filter by device tags (e.g., ['HomeAP', 'MeshAP'])"
        required: false
        location: query
        items:
          type: string
      active:
        type: boolean
        description: "Filter by active alerts (default: true for active alerts only)"
        required: false
        default: true
        location: query
      dismissed:
        type: boolean
        description: "Include dismissed alerts (default: false)"
        required: false
        default: false
        location: query
      resolved:
        type: boolean
        description: "Include resolved alerts (default: false)"
        required: false
        default: false
        location: query
      suppressAlertsForOfflineNodes:
        type: boolean
        description: "Only show connectivity alerts for offline devices to reduce noise (default: false)"
        required: false
        default: false
        location: query

  - name: get_organization_alerts_overview
    description: "📊 Get summary overview of health alerts for a Meraki organization. REQUIRES organization parameter ('Prod' or 'Lab'). Shows alert counts by severity and network."
    endpoint: "organizations/{organization_id}/assurance/alerts/overview"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab')"
        required: true
        location: special
      organization_id:
        type: string
        description: "Auto-resolved from organization parameter - do not specify manually"
        required: false
        location: path
      networkId:
        type: string
        description: "Filter overview for specific network"
        required: false
        location: query
      severity:
        type: string
        description: "Filter overview by severity level"
        required: false
        location: query
        enum: ["critical", "warning", "informational"]
      types:
        type: array
        description: "Filter overview by alert types"
        required: false
        location: query
        items:
          type: string
      tsStart:
        type: string
        description: "Start time for overview filtering (ISO 8601 format)"
        required: false
        location: query
        format: date-time
      tsEnd:
        type: string
        description: "End time for overview filtering (ISO 8601 format)"
        required: false
        location: query
        format: date-time
      category:
        type: string
        description: "Filter overview by category"
        required: false
        location: query
        enum: ["configuration", "connectivity", "device_health", "insights"]
      serials:
        type: array
        description: "Filter overview by device serials"
        required: false
        location: query
        items:
          type: string
      deviceTypes:
        type: array
        description: "Filter overview by device types"
        required: false
        location: query
        items:
          type: string
          enum: ["Campus Gateway", "Catalyst AP", "Catalyst Controller", "Catalyst Switch", "MCG", "MG", "MR", "MS", "MT", "MV", "MX", "VMX", "WLC", "Z"]
      deviceTags:
        type: array
        description: "Filter overview by device tags"
        required: false
        location: query
        items:
          type: string
      active:
        type: boolean
        description: "Filter overview by active alerts (default: true)"
        required: false
        default: true
        location: query
      dismissed:
        type: boolean
        description: "Include dismissed alerts in overview (default: false)"
        required: false
        default: false
        location: query
      resolved:
        type: boolean
        description: "Include resolved alerts in overview (default: false)"
        required: false
        default: false
        location: query
      suppressAlertsForOfflineNodes:
        type: boolean
        description: "Only show connectivity alerts for offline devices (default: false)"
        required: false
        default: false
        location: query

  - name: get_alert_details
    description: "🔍 Get detailed information about a specific health alert by ID. REQUIRES organization parameter ('Prod' or 'Lab')."
    endpoint: "organizations/{organization_id}/assurance/alerts/{alert_id}"
    method: GET
    parameters:
      organization:
        type: string
        description: "REQUIRED: Organization name ('Prod' or 'Lab')"
        required: true
        location: special
      organization_id:
        type: string
        description: "Auto-resolved from organization parameter - do not specify manually"
        required: false
        location: path
      alert_id:
        type: string
        description: "Alert ID from get_organization_health_alerts (e.g., '3663678296893472463')"
        required: true
        location: path